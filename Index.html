<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM TOP UP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background: #00457c;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        .video-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            cursor: pointer;
            text-align: center;
        }
        .video-card h3 {
            margin-bottom: 10px;
            color: #00457c;
        }
        .btn {
            background: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>SM TOP UP</header>

    <div class="container">
        <h2>সাম্প্রতিক ভিডিও</h2>
        <br>
        <!-- ভিডিও আইটেম - ক্লিক করলে সাবস্ক্রিপশন ধাপে নিয়ে যাবে -->
        <div class="video-card" onclick="alert('ভিডিও দেখতে হলে প্রথমে চ্যানেলগুলো সাবস্ক্রাইব ও ফলো করতে হবে!')">
            <h3>Free Fire New Update Gameplay</h3>
            <p>ভিডিওটি দেখতে এখানে ক্লিক করুন</p>
        </div>
    </div>

</body>
</html>
